[project]
name = "amplifier-module-tool-computer-use"
version = "0.1.0"
description = "Anthropic native computer-use against the Windows desktop, from WSL2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pillow>=10.0"]

[project.entry-points."amplifier.modules"]
tool-computer-use = "amplifier_module_tool_computer_use:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_computer_use"]

[tool.hatch.build.targets.wheel.force-include]
"amplifier_module_tool_computer_use/bridge.ps1" = "amplifier_module_tool_computer_use/bridge.ps1"

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Deliberately no display server (no Xvfb, no X11). The suite is designed to run
    # headless on Linux with no desktop present, stubbing the platform layer instead of
    # driving a real screen. The coexistence ship gate (scripts/verify_coexistence.py),
    # which DOES need a real X server, is not run here — see CONTRIBUTING.md.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Install modules and test dependencies
        run: |
          uv pip install -e modules/tool-computer-use -e modules/hook-computer-use
          uv pip install amplifier-core pytest pytest-asyncio

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check formatting
        run: uvx ruff@0.16.1 format --check .

      - name: Lint
        run: uvx ruff@0.16.1 check .

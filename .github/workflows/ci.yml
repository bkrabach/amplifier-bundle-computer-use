name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Deliberately no display server (no Xvfb, no X11). The suite is designed to run
    # headless on Linux with no desktop present, stubbing the platform layer instead of
    # driving a real screen. The coexistence ship gate (scripts/verify_coexistence.py),
    # which DOES need a real X server, is not run here — see CONTRIBUTING.md.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # `--clear` is load-bearing: astral-sh/setup-uv already creates `.venv`
      # when given a `python-version`, and a bare `uv venv` then fails with
      # "A virtual environment already exists at: .venv" (exit 2). Verified in
      # CI run 30725123629, which failed this way on both 3.11 and 3.12.
      - name: Create virtual environment
        run: uv venv --clear

      - name: Install modules and test dependencies
        run: |
          uv pip install -e modules/tool-computer-use -e modules/hook-computer-use
          uv pip install amplifier-core pytest pytest-asyncio

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q

      # Runs once (not per matrix entry -- the claims don't depend on Python
      # version). `ci-main-green` is skipped here: it asks the GitHub API for
      # this workflow's own most recent conclusion on `main`, which is
      # circular when run from inside a not-yet-concluded run of that same
      # workflow -- it stays a normal (non-skipped) claim for local/human
      # runs. See docs/MICROSOFT_PROPOSAL.md and scripts/verify_proposal.py
      # for what this checks and why "always" claims fail the build while
      # "drift" claims only warn.
      - name: Verify proposal claims
        if: matrix.python-version == '3.12'
        run: .venv/bin/python scripts/verify_proposal.py --skip ci-main-green

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check formatting
        run: uvx ruff@0.16.1 format --check .

      - name: Lint
        run: uvx ruff@0.16.1 check .
